version: '3.8'

services:

  db:
    image: postgres:14
    environment:
      POSTGRES_DB: genomics_db
      POSTGRES_USER: genomics_user
      POSTGRES_PASSWORD: genomics123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: genomics_db
      DB_USER: genomics_user
      DB_PASSWORD: genomics123
      DB_PORT: 5432
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: